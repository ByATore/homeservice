server:
  port: 8083

spring:
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  application:
    name: homeservice-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: homeservice
        username: nacos
        password: nacos
      config:
        import-check:
          enabled: false
        server-addr: localhost:8848
        namespace: homeservice
        file-extension: yaml
        username: nacos
        password: nacos
        shared-configs:
          - data-id: gateway-common.yaml
            refresh: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: homeservice-auth
          uri: lb://homeservice-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: homeservice-user
          uri: lb://homeservice-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: homeservice-worker
          uri: lb://homeservice-user
          predicates:
            - Path=/api/worker/**
          filters:
            - StripPrefix=1
        - id: homeservice-order
          uri: lb://homeservice-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: homeservice-service
          uri: lb://homeservice-service
          predicates:
            - Path=/api/service/**
          filters:
            - StripPrefix=1
        - id: homeservice-catalog
          uri: lb://homeservice-service
          predicates:
            - Path=/api/catalog/**
          filters:
            - StripPrefix=2
        - id: homeservice-review
          uri: lb://homeservice-review
          predicates:
            - Path=/api/review/**
          filters:
            - StripPrefix=1
        - id: homeservice-marketing
          uri: lb://homeservice-marketing
          predicates:
            - Path=/api/marketing/**
          filters:
            - StripPrefix=1
        - id: homeservice-statistics
          uri: lb://homeservice-statistics
          predicates:
            - Path=/api/statistics/**
          filters:
            - StripPrefix=1
        - id: homeservice-dispatch
          uri: lb://homeservice-dispatch
          predicates:
            - Path=/api/dispatch/**
          filters:
            - StripPrefix=1
        - id: homeservice-location
          uri: lb://homeservice-config
          predicates:
            - Path=/api/location/**
          filters:
            - StripPrefix=1
        - id: homeservice-media
          uri: lb://homeservice-media
          predicates:
            - Path=/api/media/**
          filters:
            - StripPrefix=1
        - id: homeservice-media-admin
          uri: lb://homeservice-media
          predicates:
            - Path=/api/admin/media/**
          filters:
            - StripPrefix=1
        - id: homeservice-notify
          uri: lb://homeservice-notify
          predicates:
            - Path=/api/notify/**
          filters:
            - StripPrefix=1
        - id: homeservice-finance
          uri: lb://homeservice-finance
          predicates:
            - Path=/api/finance/**
          filters:
            - StripPrefix=1
        - id: homeservice-config
          uri: lb://homeservice-config
          predicates:
            - Path=/api/config/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.homeservice: debug
    org.springframework.cloud.gateway: debug