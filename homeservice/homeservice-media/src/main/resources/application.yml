server:
  port: 8097

spring:
  application:
    name: homeservice-media
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: homeservice
        username: nacos
        password: nacos
      config:
        import-check:
          enabled: false
        server-addr: localhost:8848
        namespace: homeservice
        file-extension: yaml
        username: nacos
        password: nacos
        shared-configs:
          - data-id: media-common.yaml
            refresh: true
  datasource:
    url: jdbc:mysql://localhost:3306/homeservice?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: lw211014ly
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.homeservice: debug
