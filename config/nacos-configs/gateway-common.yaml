# Gateway 服务共享配置 (Nacos)
# dataId: gateway-common.yaml
# group: DEFAULT_GROUP

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

# 限流配置
gateway:
  rate-limit:
    enabled: true
    replenish-rate: 10
    burst-capacity: 20

# 白名单路径（无需认证）
auth:
  white-list:
    - /api/auth/login
    - /api/auth/register
    - /api/auth/sms-code
    - /api/auth/refresh-token
    - /api/catalog/**
    - /api/service/**
